name: release oss package

# Fork-specific replacement for the upstream tag/release chain.
#
# The upstream chain (tag.yaml -> build_emqx_for_test -> check_package_version ->
# build_oss_package) has been removed: it built emqx/emqx release-58, gated the
# dashboard package on `scripts/checkPackageVersion.js` (which exits non-zero
# whenever the just-started EMQX container is not answering yet), and needed
# GitHub App secrets to dispatch a workflow into emqx/emqx.
#
# This is the only workflow in the fork. It produces the dashboard asset that
# `emqx-oss/scripts/get-dashboard.sh` downloads:
#   https://github.com/YiuTerran/emqx-dashboard-oss/releases/download/<tag>/emqx-dashboard-<tag>.zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (v*) to build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          case "$REQUESTED_TAG" in
            v?*) ;;
            *)
              echo "::error::A release tag beginning with v is required."
              exit 1
              ;;
          esac
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release tag."
            exit 1
          fi
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: yarn

      - name: install deps
        run: yarn install --frozen-lockfile

      - name: build
        run: yarn build

      - name: Check connector copy secrets
        run: yarn test:copy-secrets

      - name: Check request security
        run: yarn test:request-security
      - name: Check i18n component compatibility
        run: yarn test:i18n-compatibility

      # Guard: never publish an asset that lacks the Kafka entry points.
      - name: verify kafka entry is present in the bundle
        run: |
          set -e
          ls dist/static/img/kafka_producer.*.png >/dev/null
          grep -q 'Kafka 生产者' dist/static/js/app*.js
          grep -q 'Kafka Producer' dist/static/js/app*.js
          echo "kafka entry verified"

      - name: package
        run: |
          set -e
          touch dist/version
          echo "github_ref: refs/tags/${RELEASE_TAG}" >> dist/version
          echo "github_sha: $(git rev-parse HEAD)" >> dist/version
          zip -rq "emqx-dashboard-${RELEASE_TAG}.zip" ./dist
          unzip -l "emqx-dashboard-${RELEASE_TAG}.zip" | sed -n '1,5p'

      - name: publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" \
              --title "EMQX Dashboard ${RELEASE_TAG}" \
              --generate-notes
          gh release upload "${RELEASE_TAG}" \
            "emqx-dashboard-${RELEASE_TAG}.zip" --clobber
